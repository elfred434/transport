<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation - Agence de Transport de Colis</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="sidebar"></div>

    <div class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0"><i class="fa-solid fa-envelope text-primary"></i> <span id="peer-name">Conversation</span></h2>
            <a href="liste-messagerie.html" class="btn btn-outline-secondary btn-sm">← Toutes les conversations</a>
        </div>

        <div class="page-card" style="max-width:860px;">
            <div id="alert-zone"></div>
            <div id="chat-zone" class="chat-zone"><p class="text-muted text-center mb-0">Chargement…</p></div>

            <form id="send-form" class="d-flex gap-2 align-items-end">
                <div class="flex-grow-1">
                    <textarea name="contenu" id="contenu" class="form-control" rows="2" maxlength="5000"
                              placeholder="Votre message…"></textarea>
                </div>
                <div>
                    <label class="form-label small text-muted d-block">Image (optionnel)</label>
                    <input type="file" name="fichier" id="fichier" class="form-control form-control-sm" accept="image/jpeg,image/png,image/gif,image/webp">
                </div>
                <button type="submit" class="btn btn-primary fw-bold"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        let me = null;
        let peerId = null;
        let pollTimer = null;

        (async () => {
            me = await UI.renderSidebar('liste-messagerie.html');
            if (!me) return;
            peerId = Number(UI.qs('destinataire_id'));
            if (!peerId) {
                UI.error('#chat-zone', 'destinataire_id manquant.');
                return;
            }
            await loadMessages(true);
            // Rafraîchissement périodique
            pollTimer = setInterval(() => loadMessages(false), 8000);
        })();

        async function loadMessages(scroll) {
            const zone = document.getElementById('chat-zone');
            try {
                const list = await api.get('/api/messages?destinataire_id=' + peerId);
                if (list.length && list[0].nom !== undefined) {
                    document.getElementById('peer-name').textContent =
                        (list.find(m => m.expediteur_id == peerId) || list[0]).prenom + ' '
                        + (list.find(m => m.expediteur_id == peerId) || list[0]).nom;
                }
                if (!list.length) {
                    zone.innerHTML = '<p class="text-muted text-center mb-0">Aucun message. Écrivez le premier !</p>';
                    return;
                }
                zone.innerHTML = list.map(m => {
                    const mine = Number(m.expediteur_id) === me.id;
                    return `<div class="chat-msg ${mine ? 'me' : 'other'}">
                        ${m.fichier_url ? `<a href="${UI.esc(m.fichier_url)}" target="_blank" rel="noopener">
                            <img src="${UI.esc(m.fichier_url)}" alt="pièce jointe" style="max-width:220px;border-radius:8px;" class="mb-1 d-block"></a>` : ''}
                        ${UI.nl(m.contenu)}
                        <small>${UI.datetime(m.date_envoi)}</small>
                    </div>`;
                }).join('');
                if (scroll) zone.scrollTop = zone.scrollHeight;
            } catch (e) {
                if (scroll) UI.error('#chat-zone', e.message);
            }
        }

        document.getElementById('send-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const contenu = document.getElementById('contenu').value.trim();
            const fichier = document.getElementById('fichier').files[0];
            if (!contenu && !fichier) return;
            try {
                await api.upload('/api/messages', { destinataire_id: peerId, contenu }, { fichier });
                document.getElementById('contenu').value = '';
                document.getElementById('fichier').value = '';
                await loadMessages(true);
            } catch (err) {
                document.getElementById('alert-zone').innerHTML =
                    `<div class="alert alert-danger">${UI.esc(err.message)}</div>`;
            }
        });
    </script>
</body>
</html>
