<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colis disponibles - Agence de Transport de Colis</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="sidebar"></div>

    <div class="content">
        <h2 class="mb-4"><i class="fa-solid fa-box-open text-primary"></i> Colis disponibles</h2>

        <div class="page-card">
            <form id="filter-form" class="row g-2 align-items-end mb-4">
                <div class="col-md-3">
                    <label class="form-label">Recherche</label>
                    <input type="text" name="search" class="form-control" placeholder="Nom, type, ville…">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Pays</label>
                    <input type="text" name="pays" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Ville</label>
                    <input type="text" name="ville" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Type</label>
                    <select name="type" class="form-select">
                        <option value="">Tous</option>
                        <option value="alimentaire">Alimentaire</option>
                        <option value="electronique">Électronique</option>
                        <option value="vetements">Vêtements</option>
                        <option value="documents">Documents</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1"><i class="fa-solid fa-filter"></i> Filtrer</button>
                    <button type="reset" class="btn btn-outline-secondary"><i class="fa-solid fa-eraser"></i></button>
                </div>
            </form>

            <div id="alert-zone"></div>
            <div id="colis-list" class="text-center text-muted py-4">Chargement…</div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        let me = null;

        (async () => {
            me = await UI.renderSidebar('colis.html');
            if (me) load();
        })();

        document.getElementById('filter-form').addEventListener('submit', (e) => { e.preventDefault(); load(); });
        document.getElementById('filter-form').addEventListener('reset', () => setTimeout(load, 0));

        async function load() {
            const f = document.getElementById('filter-form');
            const params = new URLSearchParams();
            if (f.search.value.trim()) params.set('search', f.search.value.trim());
            if (f.pays.value.trim()) params.set('pays', f.pays.value.trim());
            if (f.ville.value.trim()) params.set('ville', f.ville.value.trim());
            if (f.type.value) params.set('type', f.type.value);

            const zone = document.getElementById('colis-list');
            zone.innerHTML = '<p class="text-muted text-center py-4">Chargement…</p>';
            try {
                const list = await api.get('/api/colis/available' + (params.toString() ? '?' + params : ''));
                if (!list.length) {
                    zone.innerHTML = '<p class="text-muted text-center py-4">Aucun colis disponible.</p>';
                    return;
                }
                if (!me.is_transporteur) {
                    document.getElementById('alert-zone').innerHTML =
                        '<div class="alert alert-warning">Pour réserver un colis, proposez d\'abord un voyage. '
                        + '<a href="devenir-transporteur.html" class="alert-link">Devenir transporteur</a></div>';
                }
                zone.innerHTML = `<div class="row g-3">
                    ${list.map(c => `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow-sm border-0">
                            ${UI.img(c.image_url, c.nom_colis, 'card-img-top')}
                            <div class="card-body">
                                <h6 class="card-title">${UI.esc(c.nom_colis)}</h6>
                                <p class="card-text small text-muted mb-2">
                                    <i class="fa-solid fa-location-dot"></i> ${UI.esc(c.ville)}, ${UI.esc(c.pays)}<br>
                                    <i class="fa-solid fa-weight-hanging"></i> ${UI.esc(c.poids)} kg ·
                                    <i class="fa-solid fa-tag"></i> ${UI.esc(c.type_produit || 'autre')}<br>
                                    <i class="fa-solid fa-user"></i> ${UI.esc(c.proprietaire || '')}<br>
                                    <i class="fa-solid fa-calendar"></i> Limite : ${UI.date(c.date_limite)}
                                </p>
                                <div class="fw-bold text-primary">${UI.money(c.prix_estime)}</div>
                            </div>
                            <div class="card-footer bg-white border-0 d-flex gap-2">
                                <a href="colis-detail.html?id=${c.id}" class="btn btn-sm btn-outline-primary flex-grow-1">Détail</a>
                                ${me.is_transporteur ? `<a href="reservation-colis.html?colis_id=${c.id}" class="btn btn-sm btn-success flex-grow-1"><i class="fa-solid fa-handshake"></i> Réserver</a>` : ''}
                            </div>
                        </div>
                    </div>`).join('')}
                </div>`;
            } catch (e) { UI.error('#colis-list', e.message); }
        }
    </script>
</body>
</html>
