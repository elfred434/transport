<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe - Agence de Transport de Colis</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="public-body">
    <div class="container auth-container">
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <h2 class="text-center text-primary mb-4"><i class="fa-solid fa-key"></i> Nouveau mot de passe</h2>

            <div id="alert-zone"></div>

            <form id="reset-form" autocomplete="off">
                <div class="mb-3">
                    <label class="form-label">Nouveau mot de passe <small class="text-muted">(8 caractères min.)</small></label>
                    <input type="password" id="password" name="password" class="form-control" minlength="8" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirmer le mot de passe</label>
                    <input type="password" id="confirm" name="confirm" class="form-control" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">
                    <i class="fa-solid fa-key"></i> Réinitialiser
                </button>
            </form>
            <a href="login.html" class="btn btn-outline-primary w-100 mt-3 fw-bold">Retour à la connexion</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        const token = new URLSearchParams(location.search).get('token') || '';
        const zone = document.getElementById('alert-zone');

        if (!token) {
            zone.innerHTML = '<div class="alert alert-danger">Lien de réinitialisation invalide.</div>';
            document.getElementById('reset-form').style.display = 'none';
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            zone.innerHTML = '';
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            if (password !== confirm) {
                zone.innerHTML = '<div class="alert alert-danger">Les mots de passe ne correspondent pas.</div>';
                return;
            }
            try {
                const data = await api.post('/api/auth/reset-password', { token, password });
                zone.innerHTML = `<div class="alert alert-success">${UI.esc(data.message)}</div>`;
                setTimeout(() => location.href = 'login.html?reset=success', 1500);
            } catch (err) {
                zone.innerHTML = `<div class="alert alert-danger">${UI.esc(err.message)}</div>`;
            }
        });
    </script>
</body>
</html>
