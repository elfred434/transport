<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil - Agence de Transport de Colis</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="sidebar"></div>

    <div class="content">
        <h2 class="mb-4"><i class="fa-solid fa-user text-primary"></i> Mon profil</h2>

        <div class="row g-4" style="max-width:960px;">
            <div class="col-md-4">
                <div class="page-card text-center">
                    <div id="avatar-zone"></div>
                    <h5 class="mt-3" id="fullname"></h5>
                    <span class="badge bg-primary" id="role-badge"></span>
                    <div class="d-grid mt-3">
                        <a href="modifier-profil.html" class="btn btn-outline-primary">
                            <i class="fa-solid fa-pen"></i> Modifier mon profil</a>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="page-card">
                    <h5 class="mb-3">Informations</h5>
                    <table class="table table-sm">
                        <tbody id="info-body"><tr><td class="text-muted">Chargement…</td></tr></tbody>
                    </table>
                </div>
                <div class="page-card" id="transporteur-card" style="display:none;">
                    <h5 class="mb-3"><i class="fa-solid fa-truck text-primary"></i> Fiche transporteur</h5>
                    <table class="table table-sm">
                        <tbody id="transporteur-body"></tbody>
                    </table>
                    <a href="transporteur-stats.html" class="btn btn-outline-primary btn-sm">
                        <i class="fa-solid fa-chart-line"></i> Mes statistiques</a>
                    <a id="public-profile-link" href="#" class="btn btn-outline-secondary btn-sm">
                        <i class="fa-solid fa-eye"></i> Voir ma fiche publique</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        (async () => {
            const me = await UI.renderSidebar('profil.html');
            if (!me) return;

            try {
                const data = await api.get('/api/profile');
                const u = data.user;
                const t = data.transporteur;

                document.getElementById('avatar-zone').innerHTML = u.photo_url
                    ? `<img src="${UI.esc(u.photo_url)}" class="avatar-lg" alt="">`
                    : '<i class="fa-solid fa-user avatar-lg text-muted"></i>';
                document.getElementById('fullname').textContent = u.prenom + ' ' + u.nom;
                document.getElementById('role-badge').textContent = u.role;

                document.getElementById('info-body').innerHTML = `
                    <tr><th style="width:40%;">Nom</th><td>${UI.esc(u.nom)}</td></tr>
                    <tr><th>Prénom</th><td>${UI.esc(u.prenom)}</td></tr>
                    <tr><th>Email</th><td>${UI.esc(u.email)}</td></tr>
                    <tr><th>Téléphone</th><td>${UI.esc(u.telephone || '—')}</td></tr>
                    <tr><th>Inscrit le</th><td>${UI.date(u.date_inscription)}</td></tr>`;

                if (t) {
                    document.getElementById('transporteur-card').style.display = '';
                    document.getElementById('transporteur-body').innerHTML = `
                        <tr><th style="width:40%;">N° permis</th><td>${UI.esc(t.numero_permis || '—')}</td></tr>
                        <tr><th>Véhicule</th><td>${UI.esc(t.vehicule || '—')}</td></tr>
                        <tr><th>Compagnie</th><td>${UI.esc(t.compagnie || '—')}</td></tr>
                        <tr><th>Adresse</th><td>${UI.esc(t.adresse || '—')}, ${UI.esc(t.ville || '')} (${UI.esc(t.pays || '')})</td></tr>
                        <tr><th>Solde</th><td><strong class="text-success">${UI.money(t.solde)}</strong></td></tr>
                        <tr><th>Transporteur depuis</th><td>${UI.date(t.date_creation)}</td></tr>`;
                    document.getElementById('public-profile-link').href = 'profil-transporteur.html?id=' + u.id;
                }
            } catch (e) {
                UI.error('#info-body', e.message);
            }
        })();
    </script>
</body>
</html>
