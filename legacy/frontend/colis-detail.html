<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail du colis - Agence de Transport de Colis</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="sidebar"></div>

    <div class="content">
        <div id="detail-zone" class="text-center text-muted py-5">Chargement…</div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        let me = null;

        (async () => {
            me = await UI.renderSidebar('colis.html');
            if (me) load();
        })();

        async function load() {
            const id = UI.qs('id');
            const zone = document.getElementById('detail-zone');
            if (!id) { zone.innerHTML = '<div class="alert alert-danger">Identifiant de colis manquant.</div>'; return; }
            try {
                const c = await api.get('/api/colis/' + encodeURIComponent(id));
                const isOwner = me.id === c.user_id || me.role === 'admin';

                zone.innerHTML = `
                <div class="row g-4" style="max-width:1000px;">
                    <div class="col-md-5">
                        <div class="page-card text-center">
                            ${UI.img(c.image_url, c.nom_colis, 'img-fluid rounded')}
                            <h4 class="mt-3">${UI.esc(c.nom_colis)}</h4>
                            <div>${UI.badge(c.statut)}</div>
                            <div class="fw-bold text-primary fs-4 mt-2">${UI.money(c.prix_estime)}</div>
                            <p class="text-muted small mb-3">Suivi : <code>${UI.esc(c.numero_suivi)}</code></p>
                            <div class="d-grid gap-2">
                                <a href="suivi.html?numero_suivi=${encodeURIComponent(c.numero_suivi)}" class="btn btn-outline-info">
                                    <i class="fa-solid fa-search-location"></i> Suivre la livraison</a>
                                ${c.statut === 'approuve' && me.is_transporteur && !isOwner ? `
                                    <a href="reservation-colis.html?colis_id=${c.id}" class="btn btn-success">
                                    <i class="fa-solid fa-handshake"></i> Réserver ce colis</a>` : ''}
                                ${isOwner && c.statut === 'en_attente' ? `
                                    <a href="paiement.html?colis_id=${c.id}" class="btn btn-success">
                                    <i class="fa-solid fa-credit-card"></i> Payer</a>` : ''}
                                ${isOwner ? `<a href="dashboard.html" class="btn btn-outline-primary">
                                    <i class="fa-solid fa-list"></i> Gérer les réservations</a>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="col-md-7">
                        <div class="page-card">
                            <h5 class="mb-3"><i class="fa-solid fa-circle-info text-primary"></i> Informations</h5>
                            <table class="table table-sm">
                                <tbody>
                                    <tr><th style="width:45%;">Type de produit</th><td>${UI.esc(c.type_produit || '—')}</td></tr>
                                    <tr><th>Nombre de produits</th><td>${UI.esc(c.nombre_produits || '—')}</td></tr>
                                    <tr><th>Poids</th><td>${UI.esc(c.poids)} kg</td></tr>
                                    <tr><th>Dimensions</th><td>${UI.esc(c.dimensions || '—')}</td></tr>
                                    <tr><th>Destination</th><td>${UI.esc(c.ville)}, ${UI.esc(c.pays)}</td></tr>
                                    <tr><th>Adresse de départ</th><td>${UI.esc(c.adresse_depart || '—')}</td></tr>
                                    <tr><th>Adresse de destination</th><td>${UI.esc(c.adresse_destination || '—')}</td></tr>
                                    <tr><th>Date limite</th><td>${UI.date(c.date_limite)}</td></tr>
                                    <tr><th>Posté le</th><td>${UI.datetime(c.date_post)}</td></tr>
                                    <tr><th>Propriétaire</th><td>${UI.esc(c.prenom || '')} ${UI.esc(c.nom || '')}
                                        ${c.owner_email ? `<div class="small text-muted">${UI.esc(c.owner_email)} · ${UI.esc(c.owner_tel || '')}</div>` : ''}</td></tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="page-card">
                            <h5 class="mb-3"><i class="fa-solid fa-route text-primary"></i> Étapes de suivi</h5>
                            ${c.etapes_suivi && c.etapes_suivi.length ? `
                                <ul class="list-group">
                                    ${c.etapes_suivi.map(et => `
                                        <li class="list-group-item d-flex justify-content-between align-items-center">
                                            ${UI.badge(et.statut)}
                                            <span class="small text-muted">${UI.datetime(et.date_etape)}</span>
                                        </li>`).join('')}
                                </ul>` : '<p class="text-muted mb-0">Aucune étape enregistrée.</p>'}
                        </div>
                    </div>
                </div>`;
            } catch (e) {
                zone.innerHTML = `<div class="alert alert-danger">${UI.esc(e.message)}</div>
                    <a href="dashboard.html" class="btn btn-outline-primary">Retour au tableau de bord</a>`;
            }
        }
    </script>
</body>
</html>
