<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Agence de Transport de Colis</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="public-body">
    <div class="container auth-container">
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <div class="text-center mb-3">
                <img src="assets/img/logo.jpeg" alt="Logo" style="max-width:120px;border-radius:10px;">
            </div>
            <h2 class="text-center text-primary mb-4"><i class="fa-solid fa-right-to-bracket"></i> Connexion</h2>

            <div id="alert-zone"></div>

            <form id="login-form" autocomplete="off">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <div class="mb-2 text-end">
                    <a href="reset-request.html" class="text-primary text-decoration-underline">Mot de passe oublié ?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">
                    <i class="fa-solid fa-right-to-bracket"></i> Se connecter
                </button>
                <div class="text-center mt-3">
                    Pas encore de compte ? <a href="register.html" class="text-primary text-decoration-underline">Inscrivez-vous</a>
                </div>
                <div class="text-center mt-1">
                    <a href="index.html" class="text-muted small">← Accueil</a>
                    ·
                    <a href="admin/login.html" class="text-muted small">Espace admin</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        // Messages d'erreur/succès passés en query string
        const params = new URLSearchParams(location.search);
        const zone = document.getElementById('alert-zone');
        if (params.get('error') === '1') {
            zone.innerHTML = '<div class="alert alert-danger">Email ou mot de passe incorrect.</div>';
        }
        if (params.get('error') === 'invalid_token') {
            zone.innerHTML = '<div class="alert alert-danger">Lien de réinitialisation invalide ou expiré.</div>';
        }
        if (params.get('register') === 'success' || params.get('reset') === 'success') {
            zone.innerHTML = '<div class="alert alert-success">Opération réussie, vous pouvez vous connecter.</div>';
        }

        if (Auth.isLoggedIn()) location.href = 'dashboard.html';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            zone.innerHTML = '';
            try {
                const data = await api.post('/api/auth/login', {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });
                Auth.save(data.token);
                location.href = data.user.role === 'admin' ? 'admin/index.html' : 'dashboard.html';
            } catch (err) {
                zone.innerHTML = `<div class="alert alert-danger">${UI.esc(err.message)}</div>`;
            }
        });
    </script>
</body>
</html>
