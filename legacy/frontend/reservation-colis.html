<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver un colis - Agence de Transport de Colis</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="sidebar"></div>

    <div class="content">
        <h2 class="mb-4"><i class="fa-solid fa-handshake text-primary"></i> Réserver un colis</h2>
        <div class="page-card" style="max-width:860px;">
            <div id="alert-zone"></div>
            <div id="main-zone" class="text-center text-muted py-4">Chargement…</div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        let me = null;

        (async () => {
            me = await UI.renderSidebar('colis.html');
            if (me) load();
        })();

        async function load() {
            const zone = document.getElementById('main-zone');
            const colisId = UI.qs('colis_id');
            if (!colisId) { zone.innerHTML = '<div class="alert alert-danger">colis_id manquant.</div>'; return; }

            if (!me.is_transporteur) {
                zone.innerHTML = '<div class="alert alert-warning mb-0">Vous devez être transporteur pour réserver un colis. '
                    + '<a href="devenir-transporteur.html" class="alert-link">Proposer un voyage</a></div>';
                return;
            }

            try {
                const [colis, voyages] = await Promise.all([
                    api.get('/api/colis/' + encodeURIComponent(colisId)),
                    api.get('/api/voyages/mine')
                ]);

                // Voyages compatibles : approuvés, à venir, destination = pays du colis, poids max suffisant
                const compatibles = voyages.filter(v =>
                    v.statut === 'approuve'
                    && new Date(v.date_depart) >= new Date(new Date().toDateString())
                    && v.pays_destination.toLowerCase() === (colis.pays || '').toLowerCase()
                    && parseFloat(v.poids_max) >= parseFloat(colis.poids)
                );

                zone.innerHTML = `
                    <div class="border rounded-3 p-3 mb-4 d-flex gap-3 align-items-center">
                        ${UI.img(colis.image_url, colis.nom_colis, 'img-colis')}
                        <div>
                            <div class="fw-bold">${UI.esc(colis.nom_colis)} ${UI.badge(colis.statut)}</div>
                            <div class="small text-muted">${UI.esc(colis.ville)}, ${UI.esc(colis.pays)} · ${UI.esc(colis.poids)} kg · ${UI.money(colis.prix_estime)}</div>
                        </div>
                    </div>

                    ${colis.statut !== 'approuve'
                        ? '<div class="alert alert-warning mb-0">Ce colis n\'est pas encore approuvé : réservation impossible.</div>'
                        : compatibles.length ? `
                        <h6>Choisissez l'un de vos voyages compatibles</h6>
                        <div class="list-group mb-3">
                            ${compatibles.map(v => `
                                <label class="list-group-item d-flex gap-3 align-items-center">
                                    <input class="form-check-input" type="radio" name="voyage" value="${v.id}">
                                    <span>
                                        <strong>${UI.esc(v.pays_depart)} → ${UI.esc(v.pays_destination)}</strong>
                                        <span class="text-muted small d-block">
                                            Départ : ${UI.date(v.date_depart)} à ${UI.esc((v.heure_depart || '').substring(0, 5))}
                                            · Poids max : ${UI.esc(v.poids_max)} kg
                                        </span>
                                    </span>
                                </label>`).join('')}
                        </div>
                        <button id="btn-reserver" class="btn btn-success btn-lg w-100 fw-bold">
                            <i class="fa-solid fa-handshake"></i> Envoyer la réservation au propriétaire
                        </button>`
                        : `<div class="alert alert-info mb-2">Aucun de vos voyages approuvés ne correspond à ce colis
                            (destination : <strong>${UI.esc(colis.pays)}</strong>, poids : <strong>${UI.esc(colis.poids)} kg</strong>).</div>
                           <a href="devenir-transporteur.html" class="btn btn-primary">Proposer un voyage compatible</a>`}
                `;

                const btn = document.getElementById('btn-reserver');
                if (btn) btn.addEventListener('click', async () => {
                    const sel = document.querySelector('input[name=voyage]:checked');
                    if (!sel) { UI.toast('Sélectionnez un voyage.', 'error'); return; }
                    try {
                        const data = await api.post('/api/reservations', {
                            colis_id: Number(colisId), voyage_id: Number(sel.value)
                        });
                        UI.toast(data.message || 'Réservation envoyée.');
                        setTimeout(() => location.href = 'dashboard.html', 1200);
                    } catch (e) {
                        document.getElementById('alert-zone').innerHTML =
                            `<div class="alert alert-danger">${UI.esc(e.message)}</div>`;
                    }
                });
            } catch (e) { UI.error('#main-zone', e.message); }
        }
    </script>
</body>
</html>
