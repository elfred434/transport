<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes statistiques - Agence de Transport de Colis</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="sidebar"></div>

    <div class="content">
        <h2 class="mb-4"><i class="fa-solid fa-chart-line text-primary"></i> Mes statistiques transporteur</h2>

        <div id="stats-zone" class="text-center text-muted py-4">Chargement…</div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        (async () => {
            const me = await UI.renderSidebar('transporteur-stats.html');
            if (!me) return;
            const zone = document.getElementById('stats-zone');

            if (!me.is_transporteur) {
                zone.innerHTML = '<div class="alert alert-info">Vous n\'êtes pas encore transporteur. '
                    + '<a href="devenir-transporteur.html" class="alert-link">Proposer un voyage</a></div>';
                return;
            }

            try {
                const s = await api.get('/api/transporteur-stats');
                const card = (icon, label, value, color = 'primary') => `
                    <div class="col-md-3 col-6">
                        <div class="page-card text-center h-100">
                            <i class="fa-solid ${icon} text-${color}" style="font-size:2rem;"></i>
                            <div class="fs-4 fw-bold mt-2">${value}</div>
                            <div class="text-muted small">${label}</div>
                        </div>
                    </div>`;
                zone.innerHTML = `<div class="row g-3">
                    ${card('fa-wallet', 'Solde (commissions 5 %)', UI.money(s.solde), 'success')}
                    ${card('fa-plane', 'Voyages proposés', UI.esc(s.nb_voyages))}
                    ${card('fa-handshake', 'Réservations acceptées', UI.esc(s.nb_reservations_acceptees), 'info')}
                    ${card('fa-star', 'Note moyenne', (s.note_moyenne !== null ? UI.esc(s.note_moyenne) + '/5 (' + s.nb_avis + ' avis)' : '—'), 'warning')}
                </div>
                <p class="text-muted small mt-3"><i class="fa-solid fa-circle-info"></i>
                    Le solde est crédité de 5 % du prix estimé de chaque colis dont la livraison est confirmée par l'agence.</p>`;
            } catch (e) { UI.error('#stats-zone', e.message); }
        })();
    </script>
</body>
</html>
