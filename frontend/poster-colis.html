<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster un colis - Agence de Transport de Colis</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="sidebar"></div>

    <div class="content">
        <h2 class="mb-4"><i class="fa-solid fa-box text-primary"></i> Poster un colis</h2>

        <div class="page-card" style="max-width:860px;">
            <div id="alert-zone"></div>

            <form id="colis-form">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nom du colis *</label>
                        <input type="text" name="nom_colis" class="form-control" maxlength="100" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Type de produit *</label>
                        <select name="type_produit" class="form-select" required>
                            <option value="">— Choisir —</option>
                            <option value="alimentaire">Alimentaire</option>
                            <option value="electronique">Électronique</option>
                            <option value="vetements">Vêtements</option>
                            <option value="documents">Documents</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Nombre de produits *</label>
                        <input type="number" name="nombre_produits" min="1" max="10000" value="1" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Poids (kg) *</label>
                        <input type="number" name="poids" id="poids" step="0.01" min="0.01" max="1000" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Dimensions (LxlxH cm)</label>
                        <input type="text" name="dimensions" class="form-control" maxlength="50" placeholder="30x20x15">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date limite *</label>
                        <input type="date" name="date_limite" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Pays de destination *</label>
                        <input type="text" name="pays" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ville de destination *</label>
                        <input type="text" name="ville" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Adresse de départ *</label>
                        <input type="text" name="adresse_depart" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Adresse de destination *</label>
                        <input type="text" name="adresse_destination" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Photo du colis</label>
                        <input type="file" name="image_colis" class="form-control" accept="image/jpeg,image/png,image/gif,image/webp">
                    </div>
                </div>

                <div class="alert alert-secondary mt-3">
                    <i class="fa-solid fa-calculator"></i> Prix estimé :
                    <strong id="prix-estime">—</strong>
                    <span class="small text-muted">(1 000 F de base + 1 000 F par kg, majoré de 20 %, minimum 1 200 F)</span>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
                    <i class="fa-solid fa-paper-plane"></i> Poster le colis
                </button>
            </form>

            <!-- Confirmation -->
            <div id="success-zone" style="display:none;" class="text-center py-4">
                <i class="fa-solid fa-circle-check text-success" style="font-size:3.5rem;"></i>
                <h4 class="mt-3">Colis posté avec succès !</h4>
                <p>Numéro de suivi : <code class="fs-5" id="ok-numero"></code></p>
                <p class="text-muted">Une demande de paiement a été créée. Payez pour accélérer la validation.</p>
                <div class="d-flex gap-2 justify-content-center flex-wrap">
                    <a id="ok-payer" href="#" class="btn btn-success"><i class="fa-solid fa-credit-card"></i> Payer maintenant</a>
                    <a href="dashboard.html" class="btn btn-outline-primary"><i class="fa-solid fa-gauge"></i> Tableau de bord</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        (async () => { if (!(await UI.renderSidebar('poster-colis.html'))) return; })();

        // Date limite : aujourd'hui au minimum
        const today = new Date().toISOString().split('T')[0];
        document.querySelector('[name=date_limite]').min = today;

        // Calcul du prix estimé (même formule que le serveur : affichage indicatif)
        function calcPrix(poids) {
            const p = parseFloat(poids);
            if (!p || p <= 0) return null;
            return Math.round(Math.max(1000, 1000 + 1000 * p) * 1.2 * 100) / 100;
        }
        document.getElementById('poids').addEventListener('input', (e) => {
            const prix = calcPrix(e.target.value);
            document.getElementById('prix-estime').textContent = prix !== null ? UI.money(prix) : '—';
        });

        document.getElementById('colis-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const zone = document.getElementById('alert-zone');
            zone.innerHTML = '';
            const f = e.target;
            try {
                const data = await api.upload('/api/colis', {
                    nom_colis: f.nom_colis.value,
                    type_produit: f.type_produit.value,
                    nombre_produits: f.nombre_produits.value,
                    poids: f.poids.value,
                    dimensions: f.dimensions.value,
                    date_limite: f.date_limite.value,
                    pays: f.pays.value,
                    ville: f.ville.value,
                    adresse_depart: f.adresse_depart.value,
                    adresse_destination: f.adresse_destination.value
                }, { image_colis: f.image_colis.files[0] });

                f.style.display = 'none';
                zone.innerHTML = '';
                document.getElementById('ok-numero').textContent = data.numero_suivi;
                document.getElementById('ok-payer').href = 'paiement.html?colis_id=' + data.colis_id;
                document.getElementById('success-zone').style.display = '';
            } catch (err) {
                zone.innerHTML = `<div class="alert alert-danger">${UI.esc(err.message)}</div>`;
            }
        });
    </script>
</body>
</html>
