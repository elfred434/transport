<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie admin - Agence de Transport de Colis</title>
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
    <div id="sidebar">
        <div class="vertical-menu">
            <div class="logo-container">
                <a href="../index.html"><img src="../assets/img/logo.jpeg" alt="Logo" class="logo"></a>
            </div>
            <div class="user-box">
                <div class="user-name" id="admin-name">Administration</div>
                <span class="badge bg-light text-dark"><i class="fa-solid fa-headset"></i> messagerie</span>
            </div>
            <ul class="menu-items">
                <li><a href="index.html"><i class="fas fa-shield-halved"></i> Panneau d'administration</a></li>
                <li><a href="#" id="logout-link"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
            </ul>
        </div>
    </div>

    <div class="content">
        <h2 class="mb-4"><i class="fa-solid fa-headset text-primary"></i> Messagerie avec les utilisateurs</h2>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="page-card">
                    <h6 class="mb-3">Conversations</h6>
                    <div id="conv-list" class="list-group text-muted small">Chargement…</div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="page-card">
                    <h6 class="mb-3" id="peer-title">Sélectionnez une conversation</h6>
                    <div id="alert-zone"></div>
                    <div id="chat-zone" class="chat-zone"><p class="text-muted text-center mb-0">—</p></div>
                    <form id="send-form" class="d-flex gap-2" style="display:none !important;">
                        <textarea id="contenu" class="form-control" rows="2" maxlength="5000" placeholder="Votre réponse…"></textarea>
                        <button type="submit" class="btn btn-primary fw-bold"><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script>
        let me = null;
        let peerId = null;
        let pollTimer = null;

        (async () => {
            me = await UI.requireAdmin();
            if (!me) return;
            document.getElementById('admin-name').textContent = me.prenom + ' ' + me.nom;
            document.getElementById('logout-link').addEventListener('click', (e) => {
                e.preventDefault();
                UI.logout();
            });

            await loadConversations();

            // Ouverture directe si ?user_id=
            const preselect = Number(UI.qs('user_id'));
            if (preselect) selectPeer(preselect);
        })();

        async function loadConversations() {
            const zone = document.getElementById('conv-list');
            try {
                const list = await api.get('/api/admin-chat/conversations');
                if (!list.length) {
                    zone.innerHTML = '<p class="text-muted small mb-0">Aucune conversation.</p>';
                    return;
                }
                zone.innerHTML = list.map(c => `
                    <a href="#" class="list-group-item list-group-item-action conv-item d-flex gap-2 align-items-center ${peerId === c.user_id ? 'active' : ''}"
                       data-id="${c.user_id}" data-name="${UI.esc(c.prenom + ' ' + c.nom)}">
                        ${c.photo_url
                            ? `<img src="${UI.esc(c.photo_url)}" class="rounded-circle" style="width:36px;height:36px;object-fit:cover;" alt="">`
                            : '<i class="fa-solid fa-user-circle fa-xl text-muted"></i>'}
                        <div class="flex-grow-1 overflow-hidden">
                            <strong class="small">${UI.esc(c.prenom)} ${UI.esc(c.nom)}</strong>
                            <div class="text-truncate" style="max-width:180px;font-size:.78rem;">${UI.esc(c.dernier_message || '')}</div>
                        </div>
                        ${c.non_lus > 0 ? `<span class="badge bg-danger rounded-pill">${UI.esc(c.non_lus)}</span>` : ''}
                    </a>`).join('');
                zone.querySelectorAll('.conv-item').forEach(a => a.addEventListener('click', (e) => {
                    e.preventDefault();
                    selectPeer(Number(a.dataset.id));
                }));
            } catch (e) { UI.error('#conv-list', e.message); }
        }

        function selectPeer(id) {
            peerId = id;
            const item = document.querySelector(`.conv-item[data-id="${id}"]`);
            document.getElementById('peer-title').textContent = item ? item.dataset.name : 'Utilisateur #' + id;
            document.querySelectorAll('.conv-item').forEach(a =>
                a.classList.toggle('active', Number(a.dataset.id) === id));
            document.getElementById('send-form').style.cssText = 'display:flex !important;';
            loadChat(true);
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(() => loadChat(false), 8000);
        }

        async function loadChat(scroll) {
            if (!peerId) return;
            const zone = document.getElementById('chat-zone');
            try {
                const list = await api.get('/api/admin-chat?user_id=' + peerId);
                if (!list.length) {
                    zone.innerHTML = '<p class="text-muted text-center mb-0">Aucun message.</p>';
                    return;
                }
                zone.innerHTML = list.map(m => `
                    <div class="chat-msg ${m.moi ? 'me' : 'other'}">
                        ${!m.moi ? `<strong class="d-block small">${UI.esc(m.prenom)} ${UI.esc(m.nom)}</strong>` : ''}
                        ${UI.nl(m.contenu)}
                        <small>${UI.datetime(m.date_envoi)}</small>
                    </div>`).join('');
                if (scroll) zone.scrollTop = zone.scrollHeight;
            } catch (e) {
                if (scroll) UI.error('#chat-zone', e.message);
            }
        }

        document.getElementById('send-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const contenu = document.getElementById('contenu').value.trim();
            if (!contenu || !peerId) return;
            try {
                await api.post('/api/admin-chat', { destinataire_id: peerId, contenu });
                document.getElementById('contenu').value = '';
                await loadChat(true);
                loadConversations();
            } catch (err) {
                document.getElementById('alert-zone').innerHTML =
                    `<div class="alert alert-danger">${UI.esc(err.message)}</div>`;
            }
        });
    </script>
</body>
</html>
