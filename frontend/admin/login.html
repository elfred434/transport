<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Connexion</title>
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body class="public-body">
    <div class="container auth-container">
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <h2 class="text-center text-primary mb-4"><i class="fa-solid fa-shield-halved"></i> Espace admin</h2>

            <div id="alert-zone"></div>

            <form id="login-form" autocomplete="off">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">
                    <i class="fa-solid fa-right-to-bracket"></i> Se connecter
                </button>
                <div class="text-center mt-3">
                    <a href="../index.html" class="text-muted small">← Retour au site</a>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const zone = document.getElementById('alert-zone');
            zone.innerHTML = '';
            try {
                const data = await api.post('/api/auth/login', {
                    email: e.target.email.value,
                    password: e.target.password.value
                });
                if (data.user.role !== 'admin') {
                    zone.innerHTML = '<div class="alert alert-danger">Ce compte n\'est pas administrateur.</div>';
                    return;
                }
                Auth.save(data.token);
                location.href = 'index.html';
            } catch (err) {
                zone.innerHTML = `<div class="alert alert-danger">${UI.esc(err.message)}</div>`;
            }
        });
    </script>
</body>
</html>
