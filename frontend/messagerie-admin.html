<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacter l'admin - Agence de Transport de Colis</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="sidebar"></div>

    <div class="content">
        <h2 class="mb-4"><i class="fa-solid fa-headset text-primary"></i> Contacter l'administrateur</h2>

        <div class="page-card" style="max-width:860px;">
            <div id="alert-zone"></div>
            <div id="chat-zone" class="chat-zone"><p class="text-muted text-center mb-0">Chargement…</p></div>

            <form id="send-form" class="d-flex gap-2">
                <textarea name="contenu" id="contenu" class="form-control" rows="2" maxlength="5000"
                          placeholder="Votre message à l'agence…"></textarea>
                <button type="submit" class="btn btn-primary fw-bold"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        let me = null;

        (async () => {
            me = await UI.renderSidebar('messagerie-admin.html');
            if (!me) return;
            await loadMessages(true);
            setInterval(() => loadMessages(false), 8000);
        })();

        async function loadMessages(scroll) {
            const zone = document.getElementById('chat-zone');
            try {
                const list = await api.get('/api/admin-chat');
                if (!list.length) {
                    zone.innerHTML = '<p class="text-muted text-center mb-0">Aucun message. Écrivez à l\'agence !</p>';
                    return;
                }
                zone.innerHTML = list.map(m => `
                    <div class="chat-msg ${m.moi ? 'me' : 'other'}">
                        ${!m.moi ? `<strong class="d-block small">${UI.esc(m.prenom)} ${UI.esc(m.nom)} (admin)</strong>` : ''}
                        ${UI.nl(m.contenu)}
                        <small>${UI.datetime(m.date_envoi)}</small>
                    </div>`).join('');
                if (scroll) zone.scrollTop = zone.scrollHeight;
            } catch (e) {
                if (scroll) UI.error('#chat-zone', e.message);
            }
        }

        document.getElementById('send-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const contenu = document.getElementById('contenu').value.trim();
            if (!contenu) return;
            try {
                await api.post('/api/admin-chat', { contenu });
                document.getElementById('contenu').value = '';
                await loadMessages(true);
            } catch (err) {
                document.getElementById('alert-zone').innerHTML =
                    `<div class="alert alert-danger">${UI.esc(err.message)}</div>`;
            }
        });
    </script>
</body>
</html>
