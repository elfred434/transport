# Déploiement Render — https://render.com
# Le web service pointe sur backend_django/ (rootDir).
# La base de données PostgreSQL est fournie par Neon (serverless gratuit, 512MB),
# on passe la chaîne de connexion via la variable d'environnement DATABASE_URL.
services:
  - type: web
    name: spiistmove-api
    env: python
    rootDir: backend_django
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    envVars:
      - key: APP_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: KKIAPAY_SANDBOX
        value: "true"
      - key: KKIAPAY_SKIP_SSL_VERIFY
        value: "false"
      - key: APP_NAME
        value: SpiistMove
      - key: APP_FRONTEND_URL
        sync: false   # URL Vercel une fois le frontend déployé
      - key: DATABASE_URL
        sync: false   # URL Neon : postgres://user:pass@host/dbname?sslmode=require
      - key: APP_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
