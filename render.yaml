# Blueprint Render — déploiement en 1 clic.
# Le bouton "Deploy to Render" pré-remplit ce formulaire automatiquement.
# Il ne restera qu'à saisir DATABASE_URL (Neon) et générer APP_KEY/SECRET_KEY.
services:
  - type: web
    name: spiistmove-api
    env: python
    rootDir: backend_django
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    region: ohio
    envVars:
      - key: APP_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: KKIAPAY_SANDBOX
        value: "true"
      - key: KKIAPAY_SKIP_SSL_VERIFY
        value: "false"
      - key: APP_NAME
        value: SpiistMove
      - key: COMMISSION_PLATEFORME
        value: "0.95"
      - key: MONTANT_MIN_RETRAIT
        value: "2000"
      - key: DEFAULT_FROM_EMAIL
        value: test@spiistmove.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: APP_FRONTEND_URL
        value: ""
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: DATABASE_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
databases: []
